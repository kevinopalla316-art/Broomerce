{% extends 'base.html' %}

{% block title %}Login | BROOMERCE{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-shell">
    <div class="auth-visual">
      <div class="brand-block">
        <div class="auth-logo">🧹BROOMERCE</div>
        <div class="div-tagline">
           <h1 class="auth-tagline">Quality Brooms.<br />Cleaner Tomorrow.</h1>
        </div>
      </div>
      <div class="broom-illustration">
        <div class="broom broom-1"></div>
        <div class="broom broom-2"></div>
        <div class="broom broom-3"></div>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h2>Login to continue to your account</h2>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group password-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password" title="Show password">
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>

          <div class="form-row between">
            <a href="#" class="mini-link">Forgot password?</a>
          </div>

          <button type="submit" class="primary-btn full-width">Login</button>

          <div class="divider"><span>or continue with</span></div>

          <div class="social-row">
            <button type="button" class="social-btn">Google</button>
            <button type="button" class="social-btn">Facebook</button>
          </div>

          <p class="switch-copy">
            Don’t have an account?
            <a href="{{ url_for('auth.signup') }}">Sign Up</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
