{% extends 'base.html' %}

{% block title %}Sign Up | BROOMERCE{% endblock %}

{% block content %}
<section class="auth-page signup-page">
  <div class="auth-shell signup-shell">
    <div class="auth-visual"> 
      <div class="brand-block">
        <div class="auth-logo">🧹BROOMERCE</div>
        <div class="div-tagline">
          <h1 class="auth-tagline">Join and start shopping<br>Quality broom products.</h1>
        </div>
      </div>
      <div class="broom-illustration broom-illustration-alt">
        <div class="broom broom-1"></div>
        <div class="broom broom-2"></div>
        <div class="broom broom-3"></div>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-card">
        <p class="eyebrow">Create account</p>
        <h2>Create Your Account</h2>

        <form method="POST" action="{{ url_for('auth.signup') }}" class="auth-form signup-form" novalidate>
          <div class="two-col">
            <div class="form-group">
              <label for="first_name">First Name</label>
              <input id="first_name" name="first_name" type="text" placeholder="First name" required />
            </div>

            <div class="form-group">
              <label for="last_name">Last Name</label>
              <input id="last_name" name="last_name" type="text" placeholder="Last name" required />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" placeholder="09XXXXXXXXX" required />
          </div>

          <div class="form-group password-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create a password" required />
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password" title="Show password">
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>

          <div class="form-group password-field">
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm your password" required />
            <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Show password" title="Show password">
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" name="agree_terms" required />
            <span>I agree to the terms and conditions.</span>
          </label>

          <button type="submit" class="primary-btn full-width">Create Account</button>

          <p class="switch-copy">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Login</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
